<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-label="请求控制与恢复">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507465"/></marker></defs>
<style>text { font-family: 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #203e34; } .title { font-size: 30px; font-weight: 700; } .node { font-size: 23px; font-weight: 700; } .body { font-size: 18px; fill: #50665d; } .label { font-size: 16px; fill: #577165; }</style>
<rect width="100%" height="100%" fill="#f7f9f5"/>
<text x="44" y="56" class="title">请求控制与恢复</text>
<text x="44" y="89" class="body">所有采集请求共用调度；停止、重启或换任务不会清除冷却与保护。</text>
<rect x="375" y="122" width="610" height="158" rx="12" fill="#e5efe7" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="399" y="161" class="node">按调度策略发出请求</text>
<text x="399" y="196" class="body">单并发 · 正常档每连续成功 10 次提速</text>
<text x="399" y="224" class="body">随机间隔：1.5–2.5 → 1–1.5 → 0.8–1.2 秒</text>
<text x="399" y="254" class="label">重启重新预热；已有退避、冷却和保护继续生效</text>
<path d="M680 280 V306" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 306 H199 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 306 H519 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 306 H839 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 306 H1159 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="54" y="330" width="290" height="210" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="78" y="369" class="node">请求成功</text>
<text x="78" y="404" class="body">页面校验后保存数据与断点</text>
<text x="78" y="432" class="body">无冷却和保护：5 次成功</text>
<text x="78" y="460" class="body">保护期间：20 次成功</text>
<text x="78" y="488" class="body">连续达标，退避恢复一档</text>
<text x="78" y="516" class="body">恢复正常后重新预热</text>
<rect x="374" y="330" width="290" height="210" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="398" y="369" class="node">暂时故障 / 异常响应</text>
<text x="398" y="404" class="body">退避 4–8 / 8–16 / 16–32 秒</text>
<text x="398" y="432" class="body">每个操作最多尝试 3 次</text>
<text x="398" y="460" class="body">耗尽重试后保留断点</text>
<text x="398" y="488" class="body">网络 / 服务连续故障 5 次</text>
<text x="398" y="516" class="body">暂停任务，不另加保护期</text>
<rect x="694" y="330" width="290" height="210" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="369" class="node">限流 / HTTP 429</text>
<text x="718" y="404" class="body">冷却至少 60 秒</text>
<text x="718" y="432" class="body">遵守更长的 Retry-After</text>
<text x="718" y="460" class="body">记录 30 分钟保护期</text>
<text x="718" y="488" class="body">冷却结束后按当前状态重试</text>
<text x="718" y="516" class="body">15 分钟内再次触发则暂停</text>
<rect x="1014" y="330" width="290" height="210" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="1038" y="369" class="node">明确要求人机验证</text>
<text x="1038" y="404" class="body">全局暂停新请求</text>
<text x="1038" y="432" class="body">人工完成后刷新会话</text>
<text x="1038" y="460" class="body">再冷却至少 60 秒</text>
<text x="1038" y="488" class="body">记录 30 分钟保护期</text>
<text x="1038" y="516" class="body">15 分钟内再次触发则暂停</text>
<rect x="694" y="582" width="610" height="128" rx="12" fill="#e5efe7" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="621" class="node">30 分钟保护期</text>
<text x="718" y="656" class="body">间隔不低于 8–12 秒；更长退避继续生效</text>
<text x="718" y="684" class="body">保护期间不累计正常提速次数</text>
<path d="M839 540 V582" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1159 540 V582" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="694" y="750" width="610" height="86" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="789" class="node">15 分钟内再次限流或验证</text>
<text x="718" y="815" class="body">暂停并冷却至少 15 分钟，遵守更长冷却后手动继续</text>
<path d="M999 710 V750" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<text x="54" y="590" class="node">判断边界</text>
<text x="54" y="624" class="body">登录失效：重新登录并刷新会话，不计验证事件。</text>
<text x="54" y="658" class="body">明确私密：保存结论，不触发退避或加速。</text>
<text x="54" y="692" class="body">普通 403 / 未知拒绝：停止操作，不反复重试。</text>
<text x="54" y="726" class="body">空响应不判私密；有效响应清零连续网络故障。</text>
<text x="54" y="760" class="body">失败或验证前发出的迟到响应，不计入恢复或提速。</text>
<text x="54" y="794" class="body">首次扫码不计验证；验证码由用户完成。</text>
</svg>
