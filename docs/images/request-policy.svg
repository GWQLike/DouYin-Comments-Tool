<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-label="请求控制与恢复">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507465"/></marker></defs>
<style>text { font-family: 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #203e34; } .title { font-size: 30px; font-weight: 700; } .node { font-size: 23px; font-weight: 700; } .body { font-size: 18px; fill: #50665d; } .label { font-size: 16px; fill: #577165; }</style>
<rect width="100%" height="100%" fill="#f7f9f5"/>
<text x="44" y="56" class="title">请求控制与恢复</text>
<text x="44" y="89" class="body">控制状态保存到本机，停止、重启或更换任务不会清除冷却。</text>
<rect x="435" y="134" width="490" height="110" rx="12" fill="#e5efe7" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="459" y="173" class="node">按调度策略发出请求</text>
<text x="459" y="208" class="body">正常：单并发，随机间隔 2–4 秒</text>
<path d="M680 244 V284" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 284 H199 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 284 H519 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 284 H839 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 284 H1159 V330" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="54" y="330" width="290" height="160" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="78" y="369" class="node">请求成功</text>
<text x="78" y="404" class="body">保存该页及断点</text>
<text x="78" y="432" class="body">继续下一页</text>
<text x="78" y="460" class="body">退避中：20 次成功恢复一档</text>
<rect x="374" y="330" width="290" height="160" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="398" y="369" class="node">暂时失败</text>
<text x="398" y="404" class="body">退避：4–8 / 8–16 / 16–32 秒</text>
<text x="398" y="432" class="body">每个操作最多尝试 3 次</text>
<text x="398" y="460" class="body">仍失败则保留断点并报错</text>
<rect x="694" y="330" width="290" height="160" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="369" class="node">HTTP 429</text>
<text x="718" y="404" class="body">冷却至少 60 秒</text>
<text x="718" y="432" class="body">遵守更长的 Retry-After</text>
<text x="718" y="460" class="body">随后进入保护期</text>
<rect x="1014" y="330" width="290" height="160" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="1038" y="369" class="node">明确要求人机验证</text>
<text x="1038" y="404" class="body">暂停新请求，等待人工完成</text>
<text x="1038" y="432" class="body">刷新会话，再冷却 60 秒</text>
<text x="1038" y="460" class="body">随后进入保护期</text>
<rect x="694" y="582" width="610" height="104" rx="12" fill="#e5efe7" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="621" class="node">30 分钟保护期</text>
<text x="718" y="656" class="body">请求间隔至少 8–12 秒</text>
<path d="M839 490 V582" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1159 490 V582" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="694" y="722" width="610" height="88" rx="12" fill="#ffffff" stroke="#c5d4ca" stroke-width="1.5"/>
<text x="718" y="761" class="node">15 分钟内再次触发</text>
<text x="718" y="796" class="body">暂停并冷却 15 分钟，到期后由用户继续</text>
<path d="M999 686 V722" fill="none" stroke="#507465" stroke-width="2" marker-end="url(#arrow)"/>
<text x="54" y="603" class="node">判断边界</text>
<text x="54" y="642" class="body" transform="translate(0 0)">首次扫码不计入风控事件。</text>
<text x="54" y="642" class="body" transform="translate(0 34)">普通 403、空响应或未知拒绝按失败处理。</text>
<text x="54" y="642" class="body" transform="translate(0 68)">不据此判断列表私密，也不自动破解验证码。</text>
</svg>